name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: "test: Racket ${{ matrix.racket-version }} (${{ matrix.racket-variant }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 9.3 is the current release, and the version the package build server
        # installs into.  9.2 is the oldest release these packages are known to
        # work on, so it catches accidental use of anything newer.  `current`
        # is setup-racket's name for the latest snapshot, which catches
        # breakage from in-development Racket before it reaches a release.
        racket-version: ["9.2", "9.3", "current"]
        racket-variant: ["CS"]
        include:
          # BC has no `current` snapshot for setup-racket to fetch, so pin a
          # release rather than leaving the job permanently red
          - racket-version: "8.17"
            racket-variant: "BC"
    steps:
      - uses: actions/checkout@v5

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: ${{ matrix.racket-version }}
          variant: ${{ matrix.racket-variant }}
          packages: ""

      - name: Install sek-lib and sek-test
        run: raco pkg install --auto --batch sek-lib/ sek-test/

      - name: Test
        run: raco test -e -x -j 2 sek-test/

  docs:
    name: "docs build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: "9.3"
          variant: CS
          packages: ""

      # Building sek-doc is where a broken @racket[] reference or a stale
      # defproc shows up.  The docs have to be built before the
      # docs-completeness test in sek-test can check against them.
      - name: Install sek-lib and sek-doc
        run: raco pkg install --auto --batch sek-lib/ sek-doc/ sek-test/

      - name: Check that every export is documented
        run: raco test -e -x sek-test/tests/sek/test-docs-complete.rkt

  lint:
    name: "packages are well-formed"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: "9.3"
          variant: CS
          packages: ""

      # Catches a dependency declared in the wrong package, which the split
      # into sek-lib/sek-doc/sek-test exists to keep straight.
      - name: Install everything
        run: raco pkg install --auto --batch sek-lib/ sek-doc/ sek-test/ sek/

      - name: Check dependencies
        run: raco setup --check-pkg-deps --pkgs sek-lib sek-doc sek-test sek
